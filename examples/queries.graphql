# Lista paginada con búsqueda, filtro por rol y orden
query ObtenerUsuarios {
  usuarios(page: 1, limit: 5, search: "ana", role: ESTUDIANTE, orderBy: NOMBRE) {
    total
    page
    totalPages
    items {
      id
      name
      email
      age
      role
    }
  }
}

# Obtener un usuario por ID
query ObtenerUsuario($id: ID!) {
  usuario(id: $id) {
    id
    name
    email
    age
    role
    createdAt
  }
}

# Estadísticas generales
query Estadisticas {
  estadisticas {
    total
    edadPromedio
    porRol {
      role
      total
    }
  }
}
