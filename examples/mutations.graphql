mutation CrearUsuario {
  crearUsuario(data: { name: "Rosa Chávez", email: "rosa.chavez@universidad.edu.ec", age: 30, role: DOCENTE }) {
    id
    name
    role
  }
}

mutation ActualizarUsuario($id: ID!) {
  actualizarUsuario(id: $id, data: { age: 31 }) {
    id
    age
  }
}

mutation EliminarUsuario($id: ID!) {
  eliminarUsuario(id: $id) {
    id
    name
  }
}
